name: publish
on:
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-setup
      - uses: ./.github/actions/yarn-setup
      - name: publish
        env:
          YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org
        run: |
          yarn workspaces foreach -At --no-private --include='packages/*' npm publish --provenance --access=public --tolerate-republish
